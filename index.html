<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10251f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Deudas · Taller</title>
<style>
:root{--ink:#15231e;--muted:#748078;--line:#e6ebe7;--paper:#f5f7f5;--green:#14583e;--green2:#e4f2e9;--amber:#9b5b08;--amber2:#fff1d7;--blue:#3566a0;--blue2:#e8f0fa;--red:#aa3939;--white:#fff;--shadow:0 8px 28px #183c2810}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.top{background:#10251f;color:#fff;padding:22px max(20px,calc((100vw - 900px)/2));padding-bottom:25px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#adc9b8;font-weight:700}.top h1{font-size:25px;margin:6px 0 2px;letter-spacing:-.03em}.sub{font-size:13px;color:#c2d1c8}.sync{border:1px solid #496256;background:#203a30;color:#ecf6ef;border-radius:999px;padding:8px 11px;font-size:12px;white-space:nowrap}.wrap{max-width:900px;margin:auto;padding:18px 16px 80px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-2px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 12px;box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted);font-size:11px;font-weight:650}.stat strong{display:block;margin-top:5px;font-size:20px;letter-spacing:-.04em}.stat.pending strong{color:var(--amber)}.toolbar{margin:18px 0 12px;display:flex;gap:9px}.search{position:relative;flex:1}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px 13px 40px;outline:none;box-shadow:var(--shadow)}.search:before{content:'⌕';position:absolute;left:14px;top:7px;font-size:25px;color:#849189}.search input:focus{border-color:#76a287}.savedFile{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#e9f2ec;border:1px solid #d3e4d8;color:#28553b;border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:12px}.savedFile[hidden]{display:none}.savedFile button{border:0;background:#14583e;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700;font-size:11px;white-space:nowrap}.loadButton{cursor:pointer}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{background:white;border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:#5e6b63;font-size:12px;font-weight:650;white-space:nowrap;cursor:pointer}.filter.active{background:#183e2e;color:white;border-color:#183e2e}.results{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;color:var(--muted);font-size:12px}.results b{color:var(--ink)}.list{display:grid;gap:10px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow)}.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.person{font-size:15px;font-weight:750;line-height:1.25}.plate{margin-top:4px;color:#68756d;font-size:12px}.amount{text-align:right;white-space:nowrap}.amount strong{display:block;color:var(--amber);font-size:17px}.amount small{font-size:10px;color:var(--muted)}.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;color:#59665e;font-size:11px}.meta span{display:flex;gap:5px;align-items:center}.status{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:700}.s-taller{background:var(--blue2);color:var(--blue)}.s-terminado{background:var(--green2);color:var(--green)}.s-pendiente{background:var(--amber2);color:var(--amber)}.s-facturado{background:#f0eafb;color:#6846a4}.budgetLink{display:inline-flex;align-items:center;background:#183e2e;color:#fff;text-decoration:none;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:700}.budgetLink:active{transform:scale(.98)}.bar{height:5px;background:#edf0ed;border-radius:5px;overflow:hidden;margin-top:13px}.bar i{display:block;height:100%;background:#62a578;border-radius:5px}.payrow{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;padding-top:10px;border-top:1px solid #f0f2f0;color:#69756e;font-size:11px}.payrow b{color:#334239}.empty{text-align:center;background:#fff;border-radius:16px;padding:34px 16px;color:var(--muted);display:none}.foot{text-align:center;color:#849088;font-size:11px;padding:24px 0}.mobilehint{display:none}
@media(max-width:560px){.top{padding:18px 17px 22px}.top h1{font-size:23px}.wrap{padding:14px 13px 50px}.stats{gap:7px}.stat{padding:12px 9px;border-radius:13px}.stat strong{font-size:17px}.stat span{font-size:10px}.toolbar{margin-top:15px}.card{padding:14px;border-radius:15px}.person{font-size:14px}.amount strong{font-size:16px}.mobilehint{display:inline}.sub{max-width:230px}}
</style></head>
<body>
<header class="top"><div class="toprow"><div><div class="brand">Taller · seguimiento</div><h1>Deudas y trabajos</h1><div class="sub">Consulta rápida de presupuestos, facturas y pagos</div></div><div class="sync">● Vista de prueba</div></div></header>
<main class="wrap">
<section class="stats"><div class="stat pending"><span>PENDIENTE TOTAL</span><strong id="sum">—</strong></div><div class="stat"><span>TRABAJOS ABIERTOS</span><strong id="openCount">—</strong></div><div class="stat"><span>POR FACTURAR</span><strong id="invoiceCount">—</strong></div></section>
<div class="toolbar"><label class="search"><input id="q" type="search" placeholder="Buscar matrícula, cliente o presupuesto…" autocomplete="off"></label><button class="filter loadButton" id="pickWorkbook" type="button">Cargar Excel</button><input id="workbook" type="file" accept=".xlsm,.xlsx" hidden></div>
<div id="savedFileNote" class="savedFile" hidden><span id="savedFileText"></span><button id="restoreWorkbook" type="button">Leer archivo recordado</button></div><nav class="filters" id="filters"><button class="filter active" data-filter="Todos">Todos</button><button class="filter" data-filter="En taller">En taller</button><button class="filter" data-filter="Terminado">Terminados</button><button class="filter" data-filter="Facturado">Facturados</button><button class="filter" data-filter="Pendiente">Con deuda</button></nav>
<div class="results"><span id="count">—</span><span>Orden: <b>más recientes</b></span></div><section class="list" id="list"></section><div class="empty" id="empty">No hay resultados para esa búsqueda.</div>
<div class="foot" id="foot">Vista de prueba · datos ficticios · el archivo se lee en este dispositivo</div>
</main>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
const demoRows=[
 {name:'CLIENTE DE EJEMPLO',plate:'1234ABC',car:'TURISMO EJEMPLO',date:'06/11/2026',ref:'PRE-DEMO-01',total:230.63,paid:0,status:'En taller',note:'Trabajo en curso'},
 {name:'CLIENTE MUESTRA',plate:'5678DEF',car:'FURGONETA DEMO',date:'05/11/2026',ref:'PRE-DEMO-02',total:450,paid:150,status:'Terminado',note:'Pago parcial'},
 {name:'EMPRESA DEMO SL',plate:'9012GHI',car:'VEHÍCULO DEMO',date:'03/11/2026',ref:'PRE-DEMO-03',total:295.78,paid:295.78,status:'Facturado',note:'Factura F-DEMO'}
];let rows=[...demoRows];
const euro=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);let current='Todos';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amount=v=>{if(typeof v==='number')return v;let s=String(v??'').trim().replace(/[€\s]/g,'');if(!s||s==='-')return 0;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');const n=Number(s);return Number.isFinite(n)?n:0};
function cellText(ws,rowIndex,colIndex){if(colIndex==null)return '';const cell=ws[XLSX.utils.encode_cell({r:rowIndex,c:colIndex})];if(!cell)return '';const shown=String(cell.w??'').trim();if(cell.t==='n'&&/^[-+]?\d+(?:[.,]\d+)?$/.test(shown))return '';return shown||(['s','str','inlineStr'].includes(cell.t)?String(cell.v??'').trim():'')}
function normStatus(v){const s=String(v??'').trim();if(/^F\s*\d/i.test(s)||/facturad/i.test(s))return 'Facturado';if(/taller/i.test(s))return 'En taller';if(/terminad|finalizad/i.test(s))return 'Terminado';return s||'Pendiente'}
function fromWorkbook(file){if(!window.XLSX)throw new Error('No se pudo cargar el lector de Excel. Comprueba la conexión e inténtalo de nuevo.');return file.arrayBuffer().then(buf=>{const wb=XLSX.read(buf,{type:'array',cellDates:true});const sheetName=wb.SheetNames.find(n=>n.toLowerCase()==='hoja2')||wb.SheetNames[0];const ws=wb.Sheets[sheetName];const matrix=XLSX.utils.sheet_to_json(ws,{header:1,range:3,defval:'',raw:true});const headers=matrix.shift().map(x=>String(x).trim().toUpperCase());const idx=Object.fromEntries(headers.map((h,i)=>[h,i]));const get=(row,label)=>row[idx[label]];if(idx['DEBE AUN']==null||idx['MATRICULA']==null||idx['TOTAL']==null)throw new Error('No encuentro la tabla de deudas esperada en la hoja.');const parsed=matrix.map((row,ri)=>{const name=String(get(row,'NOMBRE')??'').trim(),plate=String(get(row,'MATRICULA')??'').trim(),ref=String(get(row,'NUMERO')??'').trim();const total=amount(get(row,'TOTAL'));let paid=0;const payments=[];for(let i=1;i<=5;i++){const paymentRaw=get(row,'PAGO'+i),paymentText=String(paymentRaw??'').trim(),val=amount(paymentRaw),date=cellText(ws,ri+4,idx['FECHA P'+i]);if(val)paid+=val;const paymentLabel=val?`Pago ${i}: ${euro(val)}`:paymentText?`Pago ${i}: ${paymentText}`:'';const dateLabel=date?`Fecha/nota P${i}: ${date}`:'';if(paymentLabel||dateLabel)payments.push([paymentLabel,dateLabel].filter(Boolean).join(' · '))}for(let i=6;i<=8;i++){const note=cellText(ws,ri+4,idx['FECHA P'+i]);if(note)payments.push(`Fecha/nota P${i}: ${note}`)}const owing=amount(get(row,'DEBE AUN'));const status=normStatus(get(row,'ESTADO'));const rawLink=ws['F'+(ri+5)]?.l?.Target||'';let link='';try{const url=new URL(rawLink);if(url.protocol==='https:'||url.protocol==='http:')link=url.href}catch{}return{name,plate,link,car:String(get(row,'MARCA/MODELO')??'').trim(),date:cellText(ws,ri+4,idx['FECHA']),ref,total,paid,owing,status,note:String(get(row,'ESTADO')??'').trim(),payments}}).filter(r=>r.name||r.plate||r.ref).filter(r=>r.name.toLowerCase()!=='nombre'&&r.plate.toLowerCase()!=='matricula');return{parsed,sheetName}})}
function updateStats(){const due=rows.reduce((s,r)=>s+Math.max(0,r.owing??r.total-r.paid),0);document.querySelector('#sum').textContent=euro(due);document.querySelector('#openCount').textContent=rows.filter(r=>r.status==='En taller').length;document.querySelector('#invoiceCount').textContent=rows.filter(r=>r.status!=='Facturado'&&Math.max(0,r.owing??r.total-r.paid)>0).length}
function render(){const term=document.querySelector('#q').value.trim().toLowerCase();const visible=rows.filter(r=>{let due=Math.max(0,r.owing??r.total-r.paid);let match=current==='Todos'||(current==='Pendiente'?due>0:r.status===current);return match&&[r.name,r.plate,r.car,r.ref,r.note,...(r.payments||[])].join(' ').toLowerCase().includes(term)});document.querySelector('#count').innerHTML=`<b>${visible.length}</b> trabajos`;document.querySelector('#empty').style.display=visible.length?'none':'block';document.querySelector('#list').innerHTML=visible.map(r=>{let due=Math.max(0,r.owing??r.total-r.paid),pct=r.total?Math.max(0,Math.min(100,Math.round(r.paid/r.total*100))):0;let cls=r.status==='En taller'?'s-taller':r.status==='Terminado'?'s-terminado':'s-facturado';const pays=r.payments?.length?r.payments.map(x=>`<span>${safe(x)}</span>`).join(''):`<span>Pagado <b>${euro(r.paid)}</b></span>`;return `<article class="card"><div class="cardtop"><div><div class="person">${safe(r.name)}</div><div class="plate">${safe(r.plate)} · ${safe(r.car)}</div></div><div class="amount"><strong>${euro(due)}</strong><small>pendiente</small></div></div><div class="meta"><span>📅 ${safe(r.date)}</span><span>📄 ${safe(r.ref)}</span><span class="status ${cls}">${safe(r.status)}</span>${r.link?`<a class="budgetLink" href="${safe(r.link)}" target="_blank" rel="noopener noreferrer">Abrir presupuesto ↗</a>`:""}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="payrow"><span>Total <b>${euro(r.total)}</b></span>${pays}<span>${safe(r.note)}</span></div></article>`}).join('')}
const fileInput=document.querySelector('#workbook'), foot=document.querySelector('#foot'), savedFileNote=document.querySelector('#savedFileNote');
function openHandleDb(){return new Promise((resolve,reject)=>{const request=indexedDB.open('deudas-taller-files',1);request.onupgradeneeded=()=>request.result.createObjectStore('handles');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
async function saveRememberedHandle(handle){const db=await openHandleDb();return new Promise((resolve,reject)=>{const tx=db.transaction('handles','readwrite');tx.objectStore('handles').put(handle,'workbook');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function getRememberedHandle(){const db=await openHandleDb();return new Promise((resolve,reject)=>{const tx=db.transaction('handles','readonly'),request=tx.objectStore('handles').get('workbook');request.onsuccess=()=>{const handle=request.result;db.close();resolve(handle)};request.onerror=()=>{db.close();reject(request.error)}})}
async function loadWorkbook(file,restored=false){foot.textContent='Leyendo el archivo en este dispositivo…';try{const result=await fromWorkbook(file);rows=result.parsed;updateStats();render();document.querySelector('.sync').textContent='● '+file.name;savedFileNote.hidden=true;foot.textContent=`${rows.length.toLocaleString('es-ES')} trabajos cargados desde ${result.sheetName}. El archivo no se ha enviado ni modificado.`}catch(err){foot.textContent=err.message||'No se pudo leer el archivo.';if(restored){savedFileNote.hidden=false;document.querySelector('#savedFileText').textContent='No pude abrir el archivo recordado. Selecciónalo otra vez con «Cargar Excel».'}}}
async function chooseWorkbook(){if('showOpenFilePicker' in window){try{const [handle]=await window.showOpenFilePicker({multiple:false,types:[{description:'Libros de Excel',accept:{'application/vnd.ms-excel.sheet.macroEnabled.12':['.xlsm'],'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});await saveRememberedHandle(handle);await loadWorkbook(await handle.getFile())}catch(err){if(err.name!=='AbortError')foot.textContent='No se pudo abrir el archivo. Puedes volver a intentarlo.'}}else{fileInput.click()}}
document.querySelector('#pickWorkbook').addEventListener('click',chooseWorkbook);
fileInput.addEventListener('change',async e=>{const file=e.target.files?.[0];if(file)await loadWorkbook(file);e.target.value=''});
document.querySelector('#restoreWorkbook').addEventListener('click',async()=>{try{const handle=await getRememberedHandle();if(!handle)return;let permission=await handle.queryPermission({mode:'read'});if(permission!=='granted')permission=await handle.requestPermission({mode:'read'});if(permission==='granted')await loadWorkbook(await handle.getFile(),true);else document.querySelector('#savedFileText').textContent='El navegador no dio permiso. Pulsa «Cargar Excel» y vuelve a elegir el archivo.'}catch{document.querySelector('#savedFileText').textContent='No pude acceder al archivo recordado. Elige de nuevo el Excel.'}});
async function restoreRememberedWorkbook(){if(!('showOpenFilePicker' in window)||!window.indexedDB)return;try{const handle=await getRememberedHandle();if(!handle)return;const permission=await handle.queryPermission({mode:'read'});if(permission==='granted'){await loadWorkbook(await handle.getFile(),true)}else{savedFileNote.hidden=false;document.querySelector('#savedFileText').textContent=`Archivo recordado: ${handle.name}.`;document.querySelector('#restoreWorkbook').textContent='Actualizar desde archivo'}}catch{savedFileNote.hidden=false;document.querySelector('#savedFileText').textContent='El archivo guardado ya no está disponible. Vuelve a elegirlo.'}}
restoreRememberedWorkbook();document.querySelector('#q').addEventListener('input',render);document.querySelector('#filters').addEventListener('click',e=>{if(e.target.matches('button')){current=e.target.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===e.target));render()}});updateStats();render();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
